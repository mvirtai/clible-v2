
version: '3.8'

services:
  clible-web:
    build:
      context: .
      dockerfile: src/clible-web/Dockerfile
    container_name: clible-web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      - CLIBLE_DB_PATH=/data/clible.db
      - CLIBLE_GCS_BUCKET=${CLIBLE_GCS_BUCKET:-}
    volumes:
      - clible-data:/home/clible/.clible-data
      - clible-web-data:/app/web/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - clible-web
    environment:
      - DOMAIN=${DOMAIN:-localhost}

volumes:
  clible-data:
    driver: local
  clible-web-data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
