[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clible"]

[project]
name = "clible-v2"
version = "0.1.0"
description = "Bible Study tool in CLI with users, sessions, text analytic experiments, export to different file types and basic read, diff, ref properties."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "pylance>=2.0.1",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "ruff>=0.15.1",
]

[project.scripts]
clible = "clible.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
# addopts = "--cov=clible"  # Re-enable when pytest-cov is added (e.g. Ticket 0.3)
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:cannot collect test class 'Testament':pytest.PytestCollectionWarning"]

# Dependencies will be added per PLAN.md tickets.
# Runtime: click, rich, requests
# Dev/test: pytest, pytest-mock, pytest-cov, ruff
# See Ticket 0.1 for setup.

[tool.ruff]
# Configure Ruff for code style and linting that matches project conventions.
line-length = 100
target-version = "py312"
extend-exclude = ["src/scripts/NOT_IN_USE_*.py"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
]
ignore = [
    "D",  # (Temporarily ignore docstring checks; re-enable if required per plan)
]


