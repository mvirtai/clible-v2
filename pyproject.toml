[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/clible"]

[project]
dependencies = [
  "click>=8.1.0",
  "go-task-bin>=3.50.0",
  "google-cloud-storage>=2.14.0",
  "pytest-cov>=7.1.0",
  "requests>=2.31.0",
  "rich>=13.0.0",
  "structlog>=24.4.0",
  "tenacity>=9.0.0"
]
description = "Bible Study tool in CLI with users, sessions, text analytic experiments, export to different file types and basic read, diff, ref properties."
name = "clible-v2"
readme = "README.md"
requires-python = ">=3.12"
version = "2.0.0"

[project.scripts]
clible = "clible.cli:main"

[dependency-groups]
analytic = [
  "pandas",
  "numpy",
  "jupyter",
]
dev = [
  "ruff>=0.15.1",
  "pytest>=8.0.0",
  "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore:cannot collect test class 'Testament':pytest.PytestCollectionWarning"]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=clible --cov-report=term-missing --cov-report=html --ignore=tests/test_api --ignore=tests/test_scripts"

[tool.coverage.run]
omit = [
  "tests/*",
  "src/clible/commands/*",
  "src/clible/api/*",
  "src/clible/scripts/*",
  "**/__init__.py",
  "**/__main__.py",
  "**/__version__.py",
  "**/__about__.py",
  "**/__config__.py",
  "**/__logging__.py",
  "**/__testing__.py",
  "**/__utils__.py",
  "**/__validators__.py",
  ]

[tool.coverage.report]
show_missing = true
fail_under = 80
precision = 2
skip_covered = true
skip_empty = true

# Dependencies will be added per PLAN.md tickets.
# Runtime: click, rich, requests
# Dev/test: pytest, pytest-mock, pytest-cov, ruff
# See Ticket 0.1 for setup.

[tool.ruff]
# Configure Ruff for code style and linting that matches project conventions.
extend-exclude = ["src/scripts/NOT_IN_USE_*.py"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
  "D", # (Temporarily ignore docstring checks; re-enable if required per plan)
]
select = [
  "E", # pycodestyle errors
  "F", # pyflakes
  "I", # isort
  "N", # pep8-naming
  "UP", # pyupgrade
]
