version: "3"

dotenv:
  - .env

vars:
  IMAGE_REPO:
    sh: 'printf "%s" "${CLIBLE_DOCKER_REPO:-docker.io/mvirtai/clible-v2}"'
  GIT_SHA:
    sh: "git rev-parse --short HEAD"
  IMAGE_TAG_COMMIT: "{{.IMAGE_REPO}}:{{.GIT_SHA}}"
  IMAGE_TAG_LATEST: "{{.IMAGE_REPO}}:latest"
  GCP_REGISTRY: "{{.CLIBLE_GCP_ARTIFACT_REGISTRY}}"
  GCP_IMAGE_COMMIT: "{{.GCP_REGISTRY}}/clible-v2dev:{{.GIT_SHA}}"
  GCP_IMAGE_LATEST: "{{.GCP_REGISTRY}}/clible-v2dev:latest"

tasks:
  web-install:
    desc: Install web app dependencies
    dir: src/clible-web
    cmds:
      - npm ci

  web-lint:
    desc: Run web app TypeScript checks
    dir: src/clible-web
    cmds:
      - npm run lint

  web-build:
    desc: Build web app with Vite
    dir: src/clible-web
    cmds:
      - npm run build

  web-docker-build:
    desc: Build clible-web Docker image
    dir: src/clible-web
    vars:
      PROGRESS: '{{default "auto" .PROGRESS}}'
    preconditions:
      - sh: "command -v docker >/dev/null 2>&1"
        msg: "Docker is required to build the web image."
    cmds:
      - docker build --progress {{.PROGRESS}} -t clible-web-ci .

  web-check:
    desc: Run web checks and Docker build
    cmds:
      - task web-install
      - task web-lint
      - task web-build
      - task web-docker-build

  web-check-no-docker:
    desc: Run web checks without Docker image build
    cmds:
      - task web-install
      - task web-lint
      - task web-build

  web-docker-run:
    dir: src/clible-web
    desc: |
      Build and run the clible-web Docker container locally for development/testing.
      The image is built from src/clible-web, and the container exposes port 3000 by default.
      To specify a different host port, use: task web-build-and-run PORT=1234
    vars:
      PORT: '{{default "3000" .PORT}}'
      PROGRESS: '{{default "auto" .PROGRESS}}'
    cmds:
      - docker build --progress {{.PROGRESS}} -t clible-web-ci .
      - docker run --rm -p {{.PORT}}:3000 clible-web-ci

  test:
    desc: Run unit tests with pytest
    cmds:
      - uv run pytest -v

  test-one:
    desc: Run selected tests by filename pattern (tests/)
    vars:
      PATTERN: '{{default "" .PATTERN}}'
    cmds:
      - |
        if [ -z "{{.PATTERN}}" ]; then
          echo "Usage: task test-one PATTERN=analytic_service"
          exit 1
        fi

        FILES="$(uv run python -c "from pathlib import Path; p='{{.PATTERN}}'.lower(); print(' '.join(str(f) for f in Path('tests').rglob('test_*.py') if p in str(f).lower()))")"
        if [ -z "$FILES" ]; then
          echo "No test files matched pattern: {{.PATTERN}}"
          exit 1
        fi

        uv run pytest -v $FILES

  lint:
    desc: Run Ruff lint checks
    cmds:
      - uv run ruff check .

  format:
    desc: Format code with Ruff formatter
    cmds:
      - uv run ruff format .

  format-check:
    desc: Check formatting without modifying files
    cmds:
      - uv run ruff format --check .

  check:
    desc: Run lint, format check, and tests
    deps: [lint, format-check, test]


  build:
    desc: Build Docker image with latest and commit tags
    deps: [check]
    preconditions:
      - sh: "command -v docker >/dev/null 2>&1"
        msg: "Docker is required to build images."
    cmds:
      - docker build --target runtime -t {{.IMAGE_TAG_COMMIT}} -t {{.IMAGE_TAG_LATEST}} .
      - task show-tags

  show-tags:
    desc: Show local tags for the clible image
    preconditions:
      - sh: "command -v docker >/dev/null 2>&1"
        msg: "Docker is required to list image tags."
    cmds:
      - echo "Built image tags:"
      - docker image inspect {{.IMAGE_TAG_COMMIT}} --format "{{`{{range .RepoTags}}{{println .}}{{end}}`}}"
      - docker image inspect {{.IMAGE_TAG_LATEST}} --format "{{`{{range .RepoTags}}{{println .}}{{end}}`}}"

  push-to-docker-hub:
    desc: Build image, show tags, and push commit + latest to Docker Hub
    deps: [build]
    preconditions:
      - sh: "command -v docker >/dev/null 2>&1"
        msg: "Docker is required to push images."
    cmds:
      - task show-tags
      - docker push {{.IMAGE_TAG_COMMIT}}
      - docker push {{.IMAGE_TAG_LATEST}}

  push-to-gcp:
    desc: Build image, tag for GCP Artifact Registry, and push (requires CLIBLE_GCP_ARTIFACT_REGISTRY)
    deps: [build]
    preconditions:
      - sh: "command -v docker >/dev/null 2>&1"
        msg: "Docker is required to push images."
      - sh: 'test -n "${CLIBLE_GCP_ARTIFACT_REGISTRY}"'
        msg: "Set CLIBLE_GCP_ARTIFACT_REGISTRY (e.g. europe-north1-docker.pkg.dev/myproject/clible)."
    cmds:
      - echo "Tagging for GCP Artifact Registry..."
      - docker tag {{.IMAGE_TAG_COMMIT}} {{.GCP_IMAGE_COMMIT}}
      - docker tag {{.IMAGE_TAG_LATEST}} {{.GCP_IMAGE_LATEST}}
      - echo "Pushing {{.GCP_IMAGE_COMMIT}} and {{.GCP_IMAGE_LATEST}}"
      - docker push {{.GCP_IMAGE_COMMIT}}
      - docker push {{.GCP_IMAGE_LATEST}}
