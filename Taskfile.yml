version: "3"

dotenv:
  - .env

vars:
  IMAGE_REPO:
    sh: 'printf "%s" "${CLIBLE_DOCKER_REPO:-docker.io/mvirtai/clible-v2}"'
  GIT_SHA:
    sh: "git rev-parse --short HEAD"
  IMAGE_TAG_COMMIT: "{{.IMAGE_REPO}}:{{.GIT_SHA}}"
  IMAGE_TAG_LATEST: "{{.IMAGE_REPO}}:latest"
  GCP_REGISTRY: "{{.CLIBLE_GCP_ARTIFACT_REGISTRY}}"
  GCP_IMAGE_COMMIT: "{{.GCP_REGISTRY}}/clible-v2dev:{{.GIT_SHA}}"
  GCP_IMAGE_LATEST: "{{.GCP_REGISTRY}}/clible-v2dev:latest"

tasks:
  web-install:
    desc: Install web app dependencies
    dir: src/clible-web
    cmds:
      - npm ci

  web-lint:
    desc: Run web app TypeScript checks
    dir: src/clible-web
    cmds:
      - npm run lint

  web-build:
    desc: Build web app with Vite
    dir: src/clible-web
    cmds:
      - npm run build

  web-test:
    desc: Run web app tests with Vitest
    deps: [web-install]
    dir: src/clible-web
    cmds:
      - npm run test

  web-prompt-print:
    desc: Print the exact Gemini prompt payload (systemInstruction + contents)
    deps: [web-install]
    dir: src/clible-web
    vars:
      MODE: '{{default "original-study" .MODE}}'
      SCOPE: '{{default "verse" .SCOPE}}'
      REF: '{{default "John 3:16" .REF}}'
      SOURCE_LANG: '{{default "grc" .SOURCE_LANG}}'
      SOURCE_TEXT: '{{default "" .SOURCE_TEXT}}'
      SOURCE_ID: '{{default "greeksblgnt" .SOURCE_ID}}'
      PASSAGE: '{{default "" .PASSAGE}}'
      TRANSLATION_TEXT: '{{default "" .TRANSLATION_TEXT}}'
      TRANSLATION_ID: '{{default "fin-1992" .TRANSLATION_ID}}'
    cmds:
      - |
        set -eu
        if [ "{{.MODE}}" = "insight" ] || [ "{{.MODE}}" = "tone" ]; then
          if [ -z "{{.PASSAGE}}" ]; then
            echo "Usage: task web-prompt-print MODE={{.MODE}} PASSAGE='...'"
            exit 1
          fi
          npm run prompt:print -- --mode "{{.MODE}}" --passage "{{.PASSAGE}}"
          exit 0
        fi
        if [ "{{.MODE}}" = "study" ]; then
          npm run prompt:print -- \
            --mode study \
            --reference "{{.REF}}" \
            --sourceLanguage "{{.SOURCE_LANG}}" \
            --fetchFromClible 1 \
            --sourceId "{{.SOURCE_ID}}" \
            --translationId "{{.TRANSLATION_ID}}" \
            ${SOURCE_TEXT:+--sourceText "{{.SOURCE_TEXT}}"} \
            ${TRANSLATION_TEXT:+--translationText "{{.TRANSLATION_TEXT}}"}
          exit 0
        fi
        npm run prompt:print -- \
          --mode original-study \
          --scope "{{.SCOPE}}" \
          --reference "{{.REF}}" \
          --sourceLanguage "{{.SOURCE_LANG}}" \
          --fetchFromClible 1 \
          --sourceId "{{.SOURCE_ID}}" \
          ${SOURCE_TEXT:+--sourceText "{{.SOURCE_TEXT}}"}

  web-docker-build:
    desc: Build clible-web Docker image
    vars:
      PROGRESS: '{{default "auto" .PROGRESS}}'
    preconditions:
      - sh: "command -v docker >/dev/null 2>&1"
        msg: "Docker is required to build the web image."
    cmds:
      - docker build --progress {{.PROGRESS}} -f src/clible-web/Dockerfile -t clible-web-ci .

  web-check:
    desc: Run web checks and Docker build
    cmds:
      - task: web-install
      - task: web-lint
      - task: web-build
      - task: web-docker-build

  web-check-no-docker:
    desc: Run web checks without Docker image build
    cmds:
      - task: web-install
      - task: web-lint
      - task: web-build

  web-docker-run:
    desc: Build clible-web image and run it locally (PORT=3000 by default). Requires DATABASE_URL or PG* env vars.
    deps: [web-docker-build]
    vars:
      PORT: '{{default "3000" .PORT}}'
    preconditions:
      - sh: "command -v docker >/dev/null 2>&1"
        msg: "Docker is required to run the web container."
    cmds:
      - |
        set -eu
        if [ -f .env ]; then
          docker run --rm -p {{.PORT}}:3000 \
            -v clible-data:/home/clible/.clible-data \
            --env-file .env \
            clible-web-ci
        else
          docker run --rm -p {{.PORT}}:3000 \
            -e GEMINI_API_KEY_FOR_BETA_TESTERS \
            -e SESSION_SECRET \
            -e DATABASE_URL \
            -v clible-data:/home/clible/.clible-data \
            clible-web-ci
        fi

  web-docker-debug:
    desc: Like web-docker-run but with NODE_ENV=development for server-side debug logs.
    deps: [web-docker-build]
    vars:
      PORT: '{{default "3000" .PORT}}'
    preconditions:
      - sh: "command -v docker >/dev/null 2>&1"
        msg: "Docker is required to run the web container."
    cmds:
      - |
        set -eu
        if [ -f .env ]; then
          docker run --rm -p {{.PORT}}:3000 \
            -v clible-data:/home/clible/.clible-data \
            --env-file .env \
            -e NODE_ENV=development \
            clible-web-ci
        else
          docker run --rm -p {{.PORT}}:3000 \
            -e GEMINI_API_KEY_FOR_BETA_TESTERS \
            -e SESSION_SECRET \
            -e DATABASE_URL \
            -e NODE_ENV=development \
            -v clible-data:/home/clible/.clible-data \
            clible-web-ci
        fi

  test:
    desc: Run Python and web tests
    cmds:
      - uv run pytest -v
      - task: web-test

  test-one:
    desc: Run selected tests by filename pattern (tests/)
    vars:
      PATTERN: '{{default "" .PATTERN}}'
    cmds:
      - |
        if [ -z "{{.PATTERN}}" ]; then
          echo "Usage: task test-one PATTERN=analytic_service"
          exit 1
        fi

        FILES="$(uv run python -c "from pathlib import Path; p='{{.PATTERN}}'.lower(); print(' '.join(str(f) for f in Path('tests').rglob('test_*.py') if p in str(f).lower()))")"
        if [ -z "$FILES" ]; then
          echo "No test files matched pattern: {{.PATTERN}}"
          exit 1
        fi

        uv run pytest -v $FILES

  lint:
    desc: Run Ruff lint checks
    cmds:
      - uv run ruff check .

  format:
    desc: Format code with Ruff formatter
    cmds:
      - uv run ruff format .

  format-check:
    desc: Auto-format code with Ruff formatter
    cmds:
      - uv run ruff format .

  check:
    desc: Run lint, format check, and tests
    cmds:
      - task: lint
      - task: format-check
      - task: test

  build:
    desc: Build Docker image with latest and commit tags
    deps: [check]
    preconditions:
      - sh: "command -v docker >/dev/null 2>&1"
        msg: "Docker is required to build images."
    cmds:
      - docker build --target runtime -t {{.IMAGE_TAG_COMMIT}} -t {{.IMAGE_TAG_LATEST}} .
      - task: show-tags

  show-tags:
    desc: Show local tags for the clible image
    preconditions:
      - sh: "command -v docker >/dev/null 2>&1"
        msg: "Docker is required to list image tags."
    cmds:
      - echo "Built image tags:"
      - docker image inspect {{.IMAGE_TAG_COMMIT}} --format "{{`{{range .RepoTags}}{{println .}}{{end}}`}}"
      - docker image inspect {{.IMAGE_TAG_LATEST}} --format "{{`{{range .RepoTags}}{{println .}}{{end}}`}}"

  push-to-docker-hub:
    desc: Build image, show tags, and push commit + latest to Docker Hub
    deps: [build]
    preconditions:
      - sh: "command -v docker >/dev/null 2>&1"
        msg: "Docker is required to push images."
    cmds:
      - task: show-tags
      - docker push {{.IMAGE_TAG_COMMIT}}
      - docker push {{.IMAGE_TAG_LATEST}}

  push-to-gcp:
    desc: Build image, tag for GCP Artifact Registry, and push (requires CLIBLE_GCP_ARTIFACT_REGISTRY)
    deps: [build]
    preconditions:
      - sh: "command -v docker >/dev/null 2>&1"
        msg: "Docker is required to push images."
      - sh: 'test -n "${CLIBLE_GCP_ARTIFACT_REGISTRY}"'
        msg: "Set CLIBLE_GCP_ARTIFACT_REGISTRY (e.g. europe-north1-docker.pkg.dev/myproject/clible)."
    cmds:
      - echo "Tagging for GCP Artifact Registry..."
      - docker tag {{.IMAGE_TAG_COMMIT}} {{.GCP_IMAGE_COMMIT}}
      - docker tag {{.IMAGE_TAG_LATEST}} {{.GCP_IMAGE_LATEST}}
      - echo "Pushing {{.GCP_IMAGE_COMMIT}} and {{.GCP_IMAGE_LATEST}}"
      - docker push {{.GCP_IMAGE_COMMIT}}
      - docker push {{.GCP_IMAGE_LATEST}}

  web-push-to-gcp:
    desc: Build and push web image to GCP Artifact Registry
    deps: [web-docker-build]
    preconditions:
      - sh: "command -v docker >/dev/null 2>&1"
        msg: "Docker is required to push images."
      - sh: 'test -n "${CLIBLE_GCP_ARTIFACT_REGISTRY}"'
        msg: "Set CLIBLE_GCP_ARTIFACT_REGISTRY."
    cmds:
      - docker tag clible-web-ci {{.GCP_REGISTRY}}/clible-web:latest
      - docker tag clible-web-ci {{.GCP_REGISTRY}}/clible-web:{{.GIT_SHA}}
      - docker push {{.GCP_REGISTRY}}/clible-web:latest
      - docker push {{.GCP_REGISTRY}}/clible-web:{{.GIT_SHA}}

  deploy-cloud-run:
    desc: Deploy web app to Google Cloud Run (DATABASE_URL points to external Postgres, e.g. Neon)
    deps: [web-push-to-gcp]
    preconditions:
      - sh: "command -v gcloud >/dev/null 2>&1"
        msg: "gcloud CLI is required."
      - sh: 'test -n "${GCP_PROJECT_ID}"'
        msg: "Set GCP_PROJECT_ID environment variable."
      - sh: 'test -n "${DATABASE_URL}"'
        msg: "Set DATABASE_URL (e.g. postgresql://user:pass@host/db from Neon or similar)."
    cmds:
      - |
        gcloud run deploy clible-web \
          --image={{.GCP_REGISTRY}}/clible-web:{{.GIT_SHA}} \
          --platform=managed \
          --region=europe-north1 \
          --ingress=all \
          --allow-unauthenticated \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10 \
          --set-env-vars="^|^NODE_ENV=production|DATABASE_URL=${DATABASE_URL}|GEMINI_API_KEY_FOR_BETA_TESTERS=${GEMINI_API_KEY_FOR_BETA_TESTERS}|SESSION_SECRET=${SESSION_SECRET}|CLIBLE_AUTO_SEED=${CLIBLE_AUTO_SEED:-web,greeksblgnt,fin-1992,fin-stlk,eng-darby}" \
          --project=${GCP_PROJECT_ID}

  gcp-web-deploy:
    desc: Build, push, and deploy clible-web to Cloud Run (uses .env.production values)
    deps: [web-push-to-gcp]
    preconditions:
      - sh: "command -v gcloud >/dev/null 2>&1"
        msg: "gcloud CLI is required."
      - sh: 'test -n "${GCP_PROJECT_ID}"'
        msg: "Set GCP_PROJECT_ID (for example via .env.production)."
      - sh: 'test -n "${GCP_REGION}${REGION}"'
        msg: "Set GCP_REGION (or REGION), for example europe-north1."
      - sh: 'test -n "${SESSION_SECRET}"'
        msg: "Set SESSION_SECRET."
      - sh: 'test -n "${GEMINI_API_KEY_FOR_BETA_TESTERS}${GEMINI_API_KEY_FOR_BETAS}"'
        msg: "Set GEMINI_API_KEY_FOR_BETA_TESTERS (or GEMINI_API_KEY_FOR_BETAS)."
      - sh: 'test -n "${DATABASE_URL}"'
        msg: "Set DATABASE_URL."
      - sh: 'test -n "${DATABASE_URL}"'
        msg: "Set DATABASE_URL (e.g. postgresql://user:pass@host/db from Neon or similar)."
    cmds:
      - |
        gcloud run deploy clible-web \
          --image={{.GCP_REGISTRY}}/clible-web:{{.GIT_SHA}} \
          --platform=managed \
          --region=${GCP_REGION:-${REGION}} \
          --project=${GCP_PROJECT_ID} \
          --ingress=all \
          --allow-unauthenticated \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=3 \
          --concurrency=80 \
          --timeout=60 \
          --set-env-vars="^|^NODE_ENV=production|MAX_REQUESTS_PER_HOUR=${MAX_REQUESTS_PER_HOUR:-10}|SESSION_SECRET=${SESSION_SECRET}|GEMINI_API_KEY_FOR_BETA_TESTERS=${GEMINI_API_KEY_FOR_BETA_TESTERS:-${GEMINI_API_KEY_FOR_BETAS}}|DATABASE_URL=${DATABASE_URL}|CLIBLE_AUTO_SEED=${CLIBLE_AUTO_SEED:-web,greeksblgnt,fin-1992,fin-stlk,eng-darby}"

  gcp-web-preflight:
    desc: Validate required env vars for Cloud Run web deploy
    preconditions:
      - sh: "command -v bash >/dev/null 2>&1"
        msg: "bash is required."
    cmds:
      - bash scripts/check-gcp-web-env.sh

  gcp-web-update-env:
    desc: Update Cloud Run environment variables without rebuilding image
    preconditions:
      - sh: "command -v gcloud >/dev/null 2>&1"
        msg: "gcloud CLI is required."
      - sh: 'test -n "${GCP_PROJECT_ID}"'
        msg: "Set GCP_PROJECT_ID (for example via .env.production)."
      - sh: 'test -n "${GCP_REGION}${REGION}"'
        msg: "Set GCP_REGION (or REGION)."
      - sh: 'test -n "${SESSION_SECRET}"'
        msg: "Set SESSION_SECRET."
      - sh: 'test -n "${GEMINI_API_KEY_FOR_BETA_TESTERS}${GEMINI_API_KEY_FOR_BETAS}"'
        msg: "Set GEMINI_API_KEY_FOR_BETA_TESTERS (or GEMINI_API_KEY_FOR_BETAS)."
      - sh: 'test -n "${DATABASE_URL}"'
        msg: "Set DATABASE_URL."
      - sh: 'test -n "${DATABASE_URL}"'
        msg: "Set DATABASE_URL."
    cmds:
      - |
        gcloud run services update clible-web \
          --region=${GCP_REGION:-${REGION}} \
          --project=${GCP_PROJECT_ID} \
          --update-env-vars="^|^NODE_ENV=production|MAX_REQUESTS_PER_HOUR=${MAX_REQUESTS_PER_HOUR:-10}|SESSION_SECRET=${SESSION_SECRET}|GEMINI_API_KEY_FOR_BETA_TESTERS=${GEMINI_API_KEY_FOR_BETA_TESTERS:-${GEMINI_API_KEY_FOR_BETAS}}|DATABASE_URL=${DATABASE_URL}|CLIBLE_AUTO_SEED=${CLIBLE_AUTO_SEED:-web,greeksblgnt,fin-1992,fin-stlk,eng-darby}"

  gcp-web-url:
    desc: Print Cloud Run service URL
    preconditions:
      - sh: "command -v gcloud >/dev/null 2>&1"
        msg: "gcloud CLI is required."
      - sh: 'test -n "${GCP_PROJECT_ID}"'
        msg: "Set GCP_PROJECT_ID."
      - sh: 'test -n "${GCP_REGION}"'
        msg: "Set GCP_REGION."
    cmds:
      - |
        gcloud run services describe clible-web \
          --region=${GCP_REGION} \
          --project=${GCP_PROJECT_ID} \
          --format='value(status.url)'

  gcp-web-health:
    desc: Run /health check against current Cloud Run URL
    preconditions:
      - sh: "command -v gcloud >/dev/null 2>&1"
        msg: "gcloud CLI is required."
      - sh: 'test -n "${GCP_PROJECT_ID}"'
        msg: "Set GCP_PROJECT_ID."
      - sh: 'test -n "${GCP_REGION}"'
        msg: "Set GCP_REGION."
    cmds:
      - |
        SERVICE_URL=$(gcloud run services describe clible-web \
          --region=${GCP_REGION} \
          --project=${GCP_PROJECT_ID} \
          --format='value(status.url)') && \
        curl -s "${SERVICE_URL}/health"

  gcp-web-logs:
    desc: Read recent Cloud Run logs for clible-web
    preconditions:
      - sh: "command -v gcloud >/dev/null 2>&1"
        msg: "gcloud CLI is required."
      - sh: 'test -n "${GCP_PROJECT_ID}"'
        msg: "Set GCP_PROJECT_ID."
      - sh: 'test -n "${GCP_REGION}"'
        msg: "Set GCP_REGION."
    cmds:
      - |
        gcloud run services logs read clible-web \
          --region=${GCP_REGION} \
          --project=${GCP_PROJECT_ID} \
          --limit=200

  terraform-init:
    desc: Initialize Terraform
    dir: terraform
    cmds:
      - terraform init

  terraform-plan:
    desc: Plan Terraform changes
    dir: terraform
    deps: [terraform-init]
    cmds:
      - terraform plan

  terraform-apply:
    desc: Apply Terraform configuration
    dir: terraform
    deps: [terraform-init]
    cmds:
      - terraform apply

  prod-local:
    desc: Run production stack locally with docker-compose
    preconditions:
      - sh: "command -v docker >/dev/null 2>&1"
        msg: "Docker is required."
    cmds:
      - docker compose -f docker-compose.prod.yml up --build
