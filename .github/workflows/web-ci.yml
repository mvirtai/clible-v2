name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "src/clible-web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/clible-web/**"
      - ".github/workflows/web-ci.yml"

jobs:
  web-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: go-task/setup-task@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/clible-web/package-lock.json

      - name: Run web CI tasks (PR)
        if: github.event_name == 'pull_request'
        run: task web-check-no-docker

      - name: Authenticate to Google Cloud (Artifact Registry)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up gcloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLIBLE_GCP_ARTIFACT_REGISTRY: ${{ secrets.CLIBLE_GCP_ARTIFACT_REGISTRY }}
        run: |
          REGISTRY_HOST="${CLIBLE_GCP_ARTIFACT_REGISTRY%%/*}"
          gcloud auth configure-docker "${REGISTRY_HOST}"

      - name: Run web CI tasks (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: task web-check
