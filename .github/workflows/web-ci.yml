name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "src/clible-web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/clible-web/**"
      - ".github/workflows/web-ci.yml"

jobs:
  web-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: go-task/setup-task@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/clible-web/package-lock.json

      - name: Run web CI tasks
        run: task web-check
