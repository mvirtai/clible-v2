name: Docs

# Builds and deploys the VitePress documentation site to GitHub Pages.
#
# One-time repository setup before the first run:
#   GitHub repo → Settings → Pages → Source: "GitHub Actions"
#
# Pull requests build the site (smoke test) but do not deploy.
# Pushes to main both build and deploy.

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs-site/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between an in-progress
# run and the latest queued run. Cancel in-progress runs to avoid pushing stale builds.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install
        working-directory: docs-site
        run: npm install --no-audit --no-fund

      - name: Build site
        working-directory: docs-site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
