name: Deploy Web to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'src/clible-web/**'
      - 'Taskfile.yml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

env:
  GCP_REGION: europe-north1
  SERVICE_NAME: clible-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Task
        uses: go-task/setup-task@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/clible-web/package-lock.json

      - name: Run web preflight checks
        run: task web-check-no-docker

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        env:
          CLIBLE_GCP_ARTIFACT_REGISTRY: ${{ secrets.CLIBLE_GCP_ARTIFACT_REGISTRY }}
        run: |
          REGISTRY_HOST="${CLIBLE_GCP_ARTIFACT_REGISTRY%%/*}"
          gcloud auth configure-docker "${REGISTRY_HOST}"

      - name: Build web Docker image
        env:
          CLIBLE_GCP_ARTIFACT_REGISTRY: ${{ secrets.CLIBLE_GCP_ARTIFACT_REGISTRY }}
        run: |
          docker build \
            -f src/clible-web/Dockerfile \
            -t "${CLIBLE_GCP_ARTIFACT_REGISTRY}/clible-web:${{ github.sha }}" \
            -t "${CLIBLE_GCP_ARTIFACT_REGISTRY}/clible-web:latest" \
            .

      - name: Push Docker image
        env:
          CLIBLE_GCP_ARTIFACT_REGISTRY: ${{ secrets.CLIBLE_GCP_ARTIFACT_REGISTRY }}
        run: |
          docker push "${CLIBLE_GCP_ARTIFACT_REGISTRY}/clible-web:${{ github.sha }}"
          docker push "${CLIBLE_GCP_ARTIFACT_REGISTRY}/clible-web:latest"

      - name: Deploy to Cloud Run
        env:
          CLIBLE_GCP_ARTIFACT_REGISTRY: ${{ secrets.CLIBLE_GCP_ARTIFACT_REGISTRY }}
          # Optional repo variable: set to 1 to reduce cold starts (higher idle cost).
          CLOUD_RUN_MIN_INSTANCES: ${{ vars.CLOUD_RUN_MIN_INSTANCES }}
        run: |
          MIN_INSTANCES="${CLOUD_RUN_MIN_INSTANCES:-0}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image="${CLIBLE_GCP_ARTIFACT_REGISTRY}/clible-web:${{ github.sha }}" \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --ingress=all \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --min-instances="${MIN_INSTANCES}" \
            --max-instances=10 \
            --set-env-vars="^|^GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}|GEMINI_API_KEY_FOR_BETA_TESTERS=${{ secrets.GEMINI_API_KEY_FOR_BETA_TESTERS }}|SESSION_SECRET=${{ secrets.SESSION_SECRET }}|NODE_ENV=production|MAX_REQUESTS_PER_HOUR=20|DATABASE_URL=${{ secrets.DATABASE_URL }}|CLIBLE_GCS_BUCKET=${{ secrets.CLIBLE_GCS_BUCKET }}|CLIBLE_AUTO_SEED=web,greeksblgnt,fin-1992,fin-stlk,eng-darby" \
            --service-account=${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "Service deployed to: $SERVICE_URL"
